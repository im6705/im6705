name: Update Greeting SVG

on:
  schedule:
    - cron: '0 22 * * *'   # KST 오전 7시
    - cron: '0 3 * * *'    # KST 낮 12시
    - cron: '0 9 * * *'    # KST 저녁 6시
  workflow_dispatch:
  
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate SVG
        run: python generate_svg.py

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add greeting.svg
          git diff --staged --quiet || git commit -m "🌤️ Update greeting SVG ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          git push
